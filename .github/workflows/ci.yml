name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck
        env:
          # Build-time env so Astro doesn't crash on missing Supabase config.
          PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          PUBLIC_SUPABASE_ANON_KEY: 'placeholder-anon-key'
          SUPABASE_SERVICE_ROLE_KEY: 'placeholder-service-role-key'
          PUBLIC_SITE_URL: 'http://localhost:4321'
          PII_HMAC_SECRET: 'ci-placeholder-secret-please-rotate-in-real-deploys'

      - name: Build
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          PUBLIC_SUPABASE_ANON_KEY: 'placeholder-anon-key'
          SUPABASE_SERVICE_ROLE_KEY: 'placeholder-service-role-key'
          PUBLIC_SITE_URL: 'http://localhost:4321'
          PII_HMAC_SECRET: 'ci-placeholder-secret-please-rotate-in-real-deploys'

  # Apply supabase/schema.sql twice against a stock Postgres 15 to catch
  # idempotency regressions: drop/create policy name mismatches, ALTER TYPE
  # + use-in-same-txn (55P04), and similar bugs that only surface on a
  # second apply against an existing project. Mirrors the convention
  # documented in CLAUDE.md "Hosted Supabase gotchas".
  schema-roundtrip:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Minimal Supabase Auth/role stand-ins used by schema and RLS tests.
      - name: Create auth stub
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/auth_stub.sql

      - name: Apply schema.sql (first run)
        run: psql -v ON_ERROR_STOP=1 -f supabase/schema.sql

      - name: Apply schema.sql (second run, should be a no-op)
        run: psql -v ON_ERROR_STOP=1 -f supabase/schema.sql

      - name: Exercise synthetic RLS identities
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/security_hardening_rls.sql

      - name: Exercise lesson tutor RLS
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/lesson_tutor_rls.sql

      # Every public table carries explicit grants (the auth stub copies the
      # legacy Supabase defaults on purpose, so a table left to the defaults
      # fails here), and retired functions stay dropped.
      - name: Check privilege hygiene
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/privilege_hygiene.sql

      # The Auth "Before User Created" hook enforces the signup domain list
      # for direct API signups (enabled per project in the dashboard).
      - name: Exercise the signup allowlist hook
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/signup_hook.sql

      # ECO 1002 was retired on 2026-11-25, together with per-day workshop
      # sections and lecture videos. Production was built while schema.sql
      # still had both courses, so rehearse that database here: build it from
      # the frozen pre-removal schema (a historical snapshot; never "update"
      # it to match today's schema), seed ECO and FIN rows, apply schema.sql
      # twice as an upgrade, check what went and what stayed, then rerun
      # every suite against the result.
      - name: Rehearse removing ECO 1002
        run: |
          createdb --maintenance-db=postgres eco_removal
          export PGDATABASE=eco_removal
          psql -v ON_ERROR_STOP=1 -f supabase/tests/auth_stub.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/pre_eco_removal_schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/eco_removal_setup.sql
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/eco_removal_check.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/security_hardening_rls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/lesson_tutor_rls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/privilege_hygiene.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/signup_hook.sql

  # Deterministic copyright gate over lesson MDX + quiz JSON: missing figure
  # credit, external/hotlinked images, references to the gitignored materials/
  # folder, suspect sources. The mechanical subset of CLAUDE.md #14 + "New
  # lesson figure". The deeper AI review is the on-demand /copyright-check
  # skill. Currently ADVISORY (not in required_status_checks) — flip to
  # required in the ruleset once it's proven quiet.
  copyright-gate:
    runs-on: ubuntu-latest
    steps:
      # Read-only job: don't persist the GITHUB_TOKEN into .git/config.
      # (Action refs use @v4 to match the rest of this workflow; SHA-pinning
      # is a separate repo-wide hardening change, not this PR's scope.)
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copyright check
        run: node scripts/check-copyright.mjs

  # Impeccable's design detector (deterministic rules, no LLM), reported as
  # PR annotations; exit 2 means findings. Two passes: source files, then
  # every public page rendered by the dev server (URLs from
  # scripts/design-detect-urls.mjs), which runs the page-level rules such as
  # line length, tiny text and contrast. REQUIRED in the main ruleset. Keep
  # the version equal to the plugin ref in .claude/settings.json.
  design-detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Scan source files
        run: npx --yes impeccable@4.9.1 detect --github src/
      # No Supabase env on purpose: public pages render without it
      # (CLAUDE.md convention #5), and signed-out is what the scan should see.
      - name: Start the dev server
        if: success() || failure()
        run: |
          npx astro preferences disable devToolbar
          npm run dev -- --port 4321 > "$RUNNER_TEMP/astro.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:4321/ && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/astro.log"
          exit 1
      - name: Scan rendered pages
        if: success() || failure()
        run: npx --yes impeccable@4.9.1 detect --github $(node scripts/design-detect-urls.mjs)
